[project]
name = "pa-toolkit-dev"
version = "0.0.0"
requires-python = ">=3.11,<3.16"
dependencies = [
  "pa-devtools[checks]==0.1.0",
  "ruff==0.14.10",
]

[tool.uv]
package = false
build-constraint-dependencies = ["hatchling==1.27.0"]

[tool.uv.sources]
pa-devtools = { path = "tools/pa-devtools", editable = true }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/dev.py" = ["E402"]
