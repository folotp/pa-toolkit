name: Release infrastructure
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Required protection contexts are Release checks (<matrix.os>); preserve names.
  checks:
    name: Release checks (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zip
      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install jq
      # Portable fixtures exercise both extension/fallback and dry-run/build.
      # A repository-specific integration dry-run belongs to the consumer CI.
      - run: python3 -m unittest discover -s tests -v
