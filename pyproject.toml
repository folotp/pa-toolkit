[project]
name = "pa-toolkit-dev"
version = "0.0.0"
requires-python = ">=3.11,<3.16"
dependencies = [
  "PyYAML==6.0.3",
  "markdown-it-py==4.2.0",
  "ruff==0.14.10",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
