name: Release infrastructure
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # These exact names are live required protection contexts. Coordinate any rename.
  checks:
    name: Release checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
          # Keep the protected context stable; explicitly select Apple Silicon.
          # Capacity failures must stay visible, without an implicit Intel fallback.
          - os: macos-latest
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify macOS Apple Silicon runner
        if: runner.os == 'macOS'
        run: |
          toolkit_machine_arch="$(uname -m)"
          printf 'Runner OS=%s architecture=%s machine=%s\n' "$RUNNER_OS" "$RUNNER_ARCH" "$toolkit_machine_arch"
          test "$RUNNER_ARCH" = ARM64
          test "$toolkit_machine_arch" = arm64
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.7'
          python-version: '3.11'
      - name: Install shell tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y jq zip unzip shfmt shellcheck
      - name: Install shell tools (macOS)
        if: runner.os == 'macOS'
        run: brew install jq shfmt shellcheck actionlint
      # Pin the Go-built CI linter; Go is only a bootstrap tool, not a toolkit gate.
      - uses: actions/setup-go@v6
        if: runner.os == 'Linux'
        with:
          go-version: '1.25.x'
          cache: false
      - name: Install actionlint (Linux)
        if: runner.os == 'Linux'
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # The generic driver executes config/release.json: full shared check exactly
      # once, then real allowlisted archive verification. Never tag/upload from CI.
      - name: Full gate and real release dry-run
        run: |
          python3 skills/plugin-release/scripts/release.py . \
            --dry-run --output "$RUNNER_TEMP/pa-toolkit-package" \
            --result "$RUNNER_TEMP/pa-toolkit-release-result.json"
